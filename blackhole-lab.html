<script>
/* Black hole lab: a test bench for a new Soundscape mode.
   A black sphere in empty space. Nothing draws it: no rim, no ring. Thousands of laser beams shoot straight out of its surface, and the
   beams on the far side are hidden by it, so the hole shows only as the place the light comes from and the dark it leaves.
   Sound: the song is split into 48 bands (not 12), and each band has its own onset track, so small sounds (a hat, a squelch, a rising
   sweep) each fire their own family of beams. Every length and brightness is eased towards a target; nothing snaps. */
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const NB=48, NBEAM=2600, R=10;

/* ---------------- audio: demo synth and the fine analysis ---------------- */
function synthDemo(){ const sr=22050, bpm=126, beat=60/bpm, bar=beat*4, dur=bar*50, n=Math.floor(sr*dur), d=new Float32Array(n); let sd=7; const rnd=()=>((sd=(sd*1664525+1013904223)>>>0)/4294967296)*2-1;
  const sect=t=>{ const b=t/bar; return b<4?0:b<8?1:b<24?2:b<28?0:b<32?1:b<48?2:0; };   // 0 quiet, 1 build, 2 full
  for(let i=0;i<n;i++){ const t=i/sr, s=sect(t), bt=t%beat, b8=t%(beat/2), bb=(t/bar)%4; let v=0;
    v+=.10*Math.sin(6.283*110*t)*(.6+.4*Math.sin(t*.7))+.07*Math.sin(6.283*164.8*t);                         // pad
    if(s===2){ v+=.95*Math.sin(6.283*(45*bt+ (75/28)*(1-Math.exp(-bt*28))))*Math.exp(-bt*7);                  // kick
      const ob=(t+beat/2)%beat; v+=.33*(2*((55*t)%1)-1)*Math.exp(-ob*5)*(ob<beat*.45?1:0); }                 // off-beat bass
    if(s>=1){ const hb=(t+beat/4)%(beat/2); v+=.16*rnd()*Math.exp(-hb*60); }                                  // hats
    if(s===1){ const p=(t/bar)%4/4; const rb=t%(beat/(p>.5?4:2)); v+=(.1+.35*p)*rnd()*Math.exp(-rb*30)+.12*p*p*rnd(); }   // snare roll and riser
    d[i]=v*.7; }
  return {data:d,sr,dur}; }

function fft(re,im){ const n=re.length; for(let i=1,j=0;i<n;i++){ let bit=n>>1; for(;j&bit;bit>>=1) j^=bit; j^=bit; if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
  for(let len=2;len<=n;len<<=1){ const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang); for(let i=0;i<n;i+=len){ let cr=1, ci=0; for(let k=0;k<len/2;k++){ const a=i+k, b=a+len/2, xr=re[b]*cr-im[b]*ci, xi=re[b]*ci+im[b]*cr; re[b]=re[a]-xr; im[b]=im[a]-xi; re[a]+=xr; im[a]+=xi; const t=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=t; } } } }
/* 48 bands spaced by ear (logarithmically) from 40 Hz to 16 kHz, about 43 readings a second. For each band: its level, and its onsets
   (how sharply it rose), each scaled by that band's own loud moments, so a quiet hi-hat counts as much as a loud kick */
function analyse(data,sr){ const N=2048, hop=1024, F=Math.max(1,Math.floor((data.length-N)/hop)), fps=sr/hop, lev=new Float32Array(F*NB), on=new Float32Array(F*NB), win=new Float32Array(N), re=new Float32Array(N), im=new Float32Array(N);
  for(let i=0;i<N;i++) win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  const edge=[]; for(let b=0;b<=NB;b++) edge.push(Math.min(N/2-1,Math.max(1,Math.round(40*Math.pow(16000/40,b/NB)/sr*N))));
  for(let f=0;f<F;f++){ const o=f*hop; for(let i=0;i<N;i++){ re[i]=data[o+i]*win[i]; im[i]=0; } fft(re,im);
    for(let b=0;b<NB;b++){ let s=0, c=0; for(let k=edge[b];k<=Math.max(edge[b],edge[b+1]-1);k++){ s+=Math.sqrt(re[k]*re[k]+im[k]*im[k]); c++; } lev[f*NB+b]=Math.log(1+s/c*6); } }
  const tmp=new Float32Array(F); let loud=new Float32Array(F);
  for(let b=0;b<NB;b++){ for(let f=0;f<F;f++) tmp[f]=lev[f*NB+b]; const srt=Float32Array.from(tmp).sort(), hi=srt[Math.floor(F*.97)]||1e-6; for(let f=0;f<F;f++) lev[f*NB+b]=Math.min(1.3,tmp[f]/Math.max(hi,1e-6));
    for(let f=1;f<F;f++) tmp[f]=Math.max(0,lev[f*NB+b]-lev[(f-1)*NB+b]); tmp[0]=0; const s2=Float32Array.from(tmp).sort(), h2=s2[Math.floor(F*.985)]||1e-6; for(let f=0;f<F;f++) on[f*NB+b]=Math.min(1.5,tmp[f]/Math.max(h2,1e-6)); }
  for(let f=0;f<F;f++){ let s=0; for(let b=0;b<NB;b++) s+=lev[f*NB+b]; loud[f]=s/NB; }
  /* big moments: where the whole spectrum jumps at once */
  const hits=[]; let last=-9; for(let f=2;f<F;f++){ let s=0; for(let b=0;b<NB;b++) s+=on[f*NB+b]; s/=NB; if(s>.42&&f/fps-last>.9){ hits.push({t:f/fps,s:Math.min(1,s)}); last=f/fps; } }
  return {fps,F,dur:data.length/sr,lev,on,loud,hits}; }

/* ---------------- rendering ---------------- */

  const m=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    vertexShader:`uniform float uLev[${NB}],uShot[${NB}]; uniform float uTime,uAll,uBass,uRest; uniform vec3 uCam; attribute vec3 aDir; attribute vec4 aInf; varying vec2 vQ; varying float vLen,vW,vHue,vGlow;

  float fire=smoothstep(.6+aInf.y*3.,.6+aInf.y*3.+.2,sh+uAll*.5);   /* few beams answer a soft sound, hundreds a hard one; never all of them, so each beam stays a line you can follow */                          // the harder the sound hits, the more of its beams answer
  float idle=.6+1.8*lv*(.25+.75*aInf.z);                                                 // a short stub that breathes with the band's level

  float br=.7+.3*sin(uTime*.35+aInf.w*40.), needle=uRest*(.15+1.25*aInf.z*aInf.z)*br; len+=${R.toFixed(1)}*needle;
  float w=(.022+.02*aInf.w+.16*low*uBass*aInf.z*fire+.02*fire);                   // low bands throw the fat beams
  vec3 p0=aDir*${R.toFixed(1)}, p=p0+aDir*len*position.y, side=normalize(cross(aDir,uCam-p)); float wq=max(w*22.,1.3);   /* room for the soft haze each beam carries, in its own colour */
  p+=side*position.x*wq; vQ=vec2(position.x*wq,(1.-position.y)*len); vLen=len; vW=w; vHue=aInf.w; vGlow=(.012+.03*lv*aInf.z+.55*fire+uRest*.05*(.35+.65*aInf.z)*br)*smoothstep(.3,5.,length(uCam-p));   /* beams aimed straight at you go dark, so the middle stays a black disc: that is the hole. And a beam passing right by the camera fades, so it cannot flood the picture */   /* a beam passing right by the camera fades, so it cannot flood the picture */
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
    fragmentShader:`precision highp float; uniform vec3 uA,uB; uniform float uRand; varying vec2 vQ; varying float vLen,vW,vHue,vGlow;
vec3 h2rgb(float h){ return clamp(abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.,0.,1.); }

  float dot_=0.;                         // the bright point at the end of every beam
  /* measured on the reference: a beam is palest and hottest at its source, and by half its length it has deepened and shifted about 15 degrees in hue; brightness barely changes */
  vec3 base=mix(mix(uA,uB,smoothstep(0.,.55,along)+(vHue-.5)*.12),h2rgb(vHue-.04*along),uRand), c=mix(base,vec3(1.),.6*exp(-along*4.2)*core*(1.-.75*uRand))*line; gl_FragColor=vec4(c*vGlow*(1.-.15*uRand),1.); }`}));   /* many different colours piled up add towards white, so the random mode runs dimmer and keeps its sources coloured */
  m.frustumCulled=false; hole.add(m);
  const pg=new THREE.BufferGeometry(), pos=new Float32Array(NBEAM*3); for(let i=0;i<NBEAM*3;i++) pos[i]=dir[i]*R*1.004; pg.setAttribute('position',new THREE.BufferAttribute(pos,3)); pg.setAttribute('aDir',new THREE.BufferAttribute(dir,3)); pg.setAttribute('aInf',new THREE.BufferAttribute(inf,4));
  const pts=new THREE.Points(pg,new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`uniform float uLev[${NB}],uShot[${NB}]; uniform float uAll,uPx,uRest,uTime; uniform vec3 uCam; attribute vec3 aDir; attribute vec4 aInf; varying float vB,vHit,vHue;
void main(){ int b=int(aInf.x+.5); float lv=uLev[b], sh=uShot[b]; float fire=smoothstep(.6+aInf.y*3.,.6+aInf.y*3.+.2,sh+uAll*.5);   /* few beams answer a soft sound, hundreds a hard one; never all of them, so each beam stays a line you can follow */
  vec3 toC=uCam-position; float dist=length(toC), face=max(0.,dot(aDir,toC/dist)); vHit=fire*pow(face,26.);     // this beam is firing and aimed at your face
  /* at rest (no music): points on the surface light up at random and fade again, with no beams. Each point has its own slow clock; on about one tick in twelve it glows, rising and falling smoothly */
  float tk=uTime*.3+aInf.w*37., ph=fract(tk), pick=step(.86,fract(sin((floor(tk)+aInf.y*91.3)*127.1)*43758.5453)), tw=0.*uRest*pick*pow(sin(3.14159*ph),2.);   /* the twinkling points of the first rest state are switched off (the 0.) in favour of the needles; make it 1. to have both */
  float size=.15+.07*fire+1.1*vHit+.22*tw; vB=.02*lv+2.2*fire+1.2*vHit+4.5*tw; vHue=aInf.w;
  gl_PointSize=clamp(size*uPx*.9/dist,2.+2.5*tw,uPx*.4); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`precision highp float; uniform vec3 uA,uB; uniform float uRand; varying float vB,vHit,vHue;

  m.frustumCulled=false; scene.add(m); return m; })();
const composer=new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene,camera)); const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(1,1),1.35,1.,.05)   /* a rich, wide glow */; composer.addPass(bloom);
/* however much light piles up, it keeps its colour: a pixel brighter than full is scaled back as a whole, so red stays red and never clips to white */
/* the same pass makes the inverse mode: the picture is drawn in white on black and turned over, so space is white and the lasers, their glow and the stars are black */
const fin=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},uInv:{value:0}},vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:'precision highp float; uniform sampler2D tDiffuse; uniform float uInv; varying vec2 vUv; void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb; float m=max(c.r,max(c.g,c.b)); c/=max(1.,m); gl_FragColor=vec4(mix(c,vec3(1.-min(1.,m)),uInv),1.); }'}); composer.addPass(fin);
function resize(){ const w=innerWidth,h=innerHeight, pr=Math.min(1.5,devicePixelRatio||1); renderer.setPixelRatio(pr); renderer.setSize(w,h,false); composer.setSize(w*pr,h*pr); camera.aspect=w/h; camera.updateProjectionMatrix(); U.uPx.value=h*pr; } addEventListener('resize',resize); resize();

/* ---------------- transport ---------------- */
let actx=null, buf=null, src=null, t0=0, off=0, playing=false, A=null;
const now=()=>playing?clamp(actx.currentTime-t0,0,A.dur):off;
function play(){ if(!buf||playing) return; src=actx.createBufferSource(); src.buffer=buf; src.connect(actx.destination); src.start(0,off); t0=actx.currentTime-off; playing=true; $('#pp').textContent='Pause'; src.onended=()=>{ if(playing&&now()>=A.dur-.05){ playing=false; off=0; $('#pp').textContent='Play'; } }; }
function pause(){ if(!playing) return; off=now(); playing=false; src.onended=null; try{ src.stop(); }catch(e){} $('#pp').textContent='Play'; }
function seek(t){ const was=playing; pause(); off=clamp(t,0,A.dur-.05); if(was) play(); }
function start(data,sr){ $('#msg').textContent='Listening to the song…'; setTimeout(()=>{ A=analyse(data,sr); actx=actx||new (window.AudioContext||window.webkitAudioContext)(); buf=actx.createBuffer(1,data.length,sr); buf.copyToChannel(data,0); off=0; $('#msg').style.display='none';
  window.__lab={A,seek,play,pause}; console.warn('BH '+JSON.stringify({dur:+A.dur.toFixed(1),fps:+A.fps.toFixed(1),frames:A.F,bigHits:A.hits.length})); actx.resume(); play(); },30); }
$('#demo').onclick=()=>{ const d=synthDemo(); start(d.data,d.sr); };
const onFile=async e=>{ const f=e.target.files[0]; if(!f) return; pause(); $('#msg').style.display=''; $('#msg').textContent='Reading the song…'; actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  try{ const b=await actx.decodeAudioData(await f.arrayBuffer()), n=b.length; if(b.duration>720){ $('#msg').textContent='That one is longer than 12 minutes. Pick a shorter song.'; return; } const d=new Float32Array(n); for(let c=0;c<b.numberOfChannels;c++){ const ch=b.getChannelData(c); for(let i=0;i<n;i++) d[i]+=ch[i]/b.numberOfChannels; } start(d,b.sampleRate); }catch(err){ $('#msg').textContent='That file could not be read as audio.'; } };
$('#file').onchange=onFile; $('#file2').onchange=onFile;
$('#pp').onclick=()=>{ if(!A) return; actx.resume(); playing?pause():play(); };
$('#seek').oninput=e=>{ if(A) seek(e.target.value*A.dur); };
$('#glow').oninput=e=>{ bloom.strength=+e.target.value; $('#glowV').textContent=(+e.target.value).toFixed(2); };
function nextCol(){ palI=(palI+1)%PALS.length; $('#col').textContent='Colour: '+PALS[palI][0]; } $('#col').onclick=nextCol;
function togStars(){ stars.visible=!stars.visible; $('#st').textContent='Stars: '+(stars.visible?'on':'off'); } $('#st').onclick=togStars;
addEventListener('keydown',e=>{ if(e.code==='KeyS') togStars(); if(e.code==='KeyC') nextCol(); if(e.code==='Space'&&A){ e.preventDefault(); playing?pause():play(); } });

/* ---------------- camera: a slow orbit; drag to turn it, scroll to move in and out. Everything eased ---------------- */
const orb={az:.6,el:.25,d:62,azT:.6,elT:.25,dT:62,drag:false,x:0,y:0,idle:0};
renderer.domElement.addEventListener('pointerdown',e=>{ orb.drag=true; orb.x=e.clientX; orb.y=e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove',e=>{ if(!orb.drag) return; orb.azT-=(e.clientX-orb.x)*.0025; orb.elT=clamp(orb.elT+(e.clientY-orb.y)*.002,-1.35,1.35);   /* half the turn per pixel: it feels heavy */ orb.x=e.clientX; orb.y=e.clientY; orb.idle=0; });
addEventListener('pointerup',()=>orb.drag=false);
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); orb.dT=clamp(orb.dT*Math.exp(e.deltaY*.001),16,220); },{passive:false});

/* ---------------- frame ---------------- */
const invM=new THREE.Matrix4(), lev=U.uLev.value, shot=U.uShot.value, smk=U.uSmoke.value; let pulse=0, pulseT=0, lastKick=-9; let last=performance.now(), hitI=0, push=0, prevT=0, allT=0;
function frame(ms){ requestAnimationFrame(frame); const dt=Math.min(.05,(ms-last)/1000); last=ms; U.uTime.value+=dt;
  if(A){ const t=now(), live=playing, fr=clamp(t*A.fps,0,A.F-1), f0=fr|0, f1=Math.min(A.F-1,f0+1), k=fr-f0; let bass=0;
    let kick=0; for(let b=0;b<NB;b++){ const L=live?A.lev[f0*NB+b]*(1-k)+A.lev[f1*NB+b]*k:0, O=live?Math.max(A.on[f0*NB+b],A.on[f1*NB+b]):0;
      lev[b]+=(L-lev[b])*Math.min(1,dt*10);                                              // the level glides
      const tgt=Math.max(O,0); shot[b]+=(tgt-shot[b])*Math.min(1,dt*(tgt>shot[b]?26:2.6)); // a shot goes out fast and comes home slowly; both are eased
      smk[b]+=(shot[b]-smk[b])*Math.min(1,dt*(shot[b]>smk[b]?2.4:.3));                        // smoke builds with the firing and hangs about after it
      if(b<6&&live) kick=Math.max(kick,O);
      if(b<8) bass+=lev[b]/8; }
    if(kick>.62&&t-lastKick>.18){ lastKick=t; pulseT=1; } if(t<lastKick) lastKick=t-1;
    U.uBass.value+=(bass-U.uBass.value)*Math.min(1,dt*8);
    if(Math.abs(t-prevT)>.5){ hitI=0; } while(hitI<A.hits.length&&A.hits[hitI].t<prevT) hitI++;
    if(live) while(hitI<A.hits.length&&A.hits[hitI].t<=t){ allT=Math.max(allT,A.hits[hitI].s); push=Math.max(push,A.hits[hitI].s); hitI++; } prevT=t;
    allT*=Math.exp(-dt*2.2); U.uAll.value+=(allT-U.uAll.value)*Math.min(1,dt*14); push*=Math.exp(-dt*1.6);   // a big moment: everything fires, and the camera leans in
    if(document.activeElement!==$('#seek')) $('#seek').value=t/A.dur; $('#tm').textContent=`${(t/60)|0}:${String((t%60)|0).padStart(2,'0')}`; }
  U.uA.value.lerp(new THREE.Vector3(...PALS[palI][1]),Math.min(1,dt*3)); U.uB.value.lerp(new THREE.Vector3(...PALS[palI][2]),Math.min(1,dt*3));
  orb.idle+=dt; if(!orb.drag&&orb.idle>1.5) orb.azT+=dt*.07;
  orb.az+=(orb.azT-orb.az)*Math.min(1,dt*2.67); orb.el+=(orb.elT-orb.el)*Math.min(1,dt*2.67);   /* and it takes half as long again to come to rest (was 4) */ orb.d+=(orb.dT*(1-.12*push)-orb.d)*Math.min(1,dt*3);
  const ce=Math.cos(orb.el); camera.position.set(Math.sin(orb.az)*ce*orb.d,Math.sin(orb.el)*orb.d,Math.cos(orb.az)*ce*orb.d); camera.lookAt(0,0,0);
  /* the hole swells on the beat and only on the beat: a kick sets the target, the size eases up to it and settles straight back */
  pulse+=(pulseT-pulse)*Math.min(1,dt*(pulseT>pulse?22:6)); pulseT*=Math.exp(-dt*9); { const sc=1+.1*pulse; hole.scale.setScalar(sc); ball.scale.setScalar(sc); }
  U.uRand.value+=((PALS[palI][0]==='random'?1:0)-U.uRand.value)*Math.min(1,dt*3); fin.uniforms.uInv.value+=((PALS[palI][0]==='inverse'?1:0)-fin.uniforms.uInv.value)*Math.min(1,dt*3);
  stars.rotation.y-=dt*.004; hole.rotation.y-=dt*.05;   /* the view circles the hole at 0.07, which makes the stars drift one way; the hole now turns the same way as that drift, a little faster than the stars, never against them */ hole.rotation.x=.25*Math.sin(U.uTime.value*.05); hole.updateMatrixWorld(); U.uCam.value.copy(camera.position).applyMatrix4(invM.copy(hole.matrixWorld).invert());   /* the shaders work in the hole's own turning frame */
  U.uRest.value+=((playing?0:1)-U.uRest.value)*Math.min(1,dt*1.5);
  composer.render(); }
requestAnimationFrame(frame);
</script></body></html>
