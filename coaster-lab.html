<script>
/* Coaster lab: a test bench for a roller coaster that is laid out from a song and ridden with real physics.
   Rules it keeps:
   - The track is built in space, metre by metre. Speed comes only from height (energy), minus rolling and air drag.
   - Curves are sized by the g-force they would give at the speed the train has there, so nothing snaps.
   - Only three things are powered, as on real rides: chain lifts, brakes before a lift, and the odd booster if the train is about to stall.
   - Sync: the chain speed of each lift is solved so the train tips over the crest exactly on the song's drop. */
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const G=14, DS=0.4;   // gravity is turned up from 9.81 so the drops bite; every curve is still sized from this same value, so the forces stay honest

/* ---------------- audio: demo synth and a small analysis ---------------- */
function synthDemo(){ const sr=22050, bpm=126, beat=60/bpm, bar=beat*4, dur=bar*50, n=Math.floor(sr*dur), d=new Float32Array(n); let sd=7; const rnd=()=>((sd=(sd*1664525+1013904223)>>>0)/4294967296)*2-1;
  const sect=t=>{ const b=t/bar; return b<4?0:b<8?1:b<24?2:b<28?0:b<32?1:b<48?2:0; };   // 0 quiet, 1 build, 2 full
  for(let i=0;i<n;i++){ const t=i/sr, s=sect(t), bt=t%beat, b8=t%(beat/2), bb=(t/bar)%4; let v=0;
    v+=.10*Math.sin(6.283*110*t)*(.6+.4*Math.sin(t*.7))+.07*Math.sin(6.283*164.8*t);                         // pad
    if(s===2){ v+=.95*Math.sin(6.283*(45*bt+ (75/28)*(1-Math.exp(-bt*28))))*Math.exp(-bt*7);                  // kick
      const ob=(t+beat/2)%beat; v+=.33*(2*((55*t)%1)-1)*Math.exp(-ob*5)*(ob<beat*.45?1:0); }                 // off-beat bass
    if(s>=1){ const hb=(t+beat/4)%(beat/2); v+=.16*rnd()*Math.exp(-hb*60); }                                  // hats
    if(s===1){ const p=(t/bar)%4/4; const rb=t%(beat/(p>.5?4:2)); v+=(.1+.35*p)*rnd()*Math.exp(-rb*30)+.12*p*p*rnd(); }   // snare roll and riser
    d[i]=v*.7; }
  return {data:d,sr,dur}; }
function analyse(data,sr){ const fps=60, hop=sr/fps, F=Math.floor(data.length/hop), E=new Float32Array(F), B=new Float32Array(F); let lp=0; const a=1-Math.exp(-6.283*140/sr);
  for(let f=0;f<F;f++){ let e=0,b=0; const i0=Math.floor(f*hop), i1=Math.floor((f+1)*hop); for(let i=i0;i<i1;i++){ const x=data[i]; lp+=(x-lp)*a; e+=x*x; b+=lp*lp; } E[f]=Math.sqrt(e/(i1-i0)); B[f]=Math.sqrt(b/(i1-i0)); }
  const norm=A=>{ const s=Array.from(A).sort((x,y)=>x-y), p=s[Math.floor(s.length*.97)]||1; for(let i=0;i<A.length;i++) A[i]=Math.min(1.2,A[i]/p); }; norm(E); norm(B);
  const inten=new Float32Array(F); { let s=0; for(let f=0;f<F;f++){ s+=(E[f]-s)*.03; inten[f]=s; } let s2=0; for(let f=F-1;f>=0;f--){ s2+=(inten[f]-s2)*.25; inten[f]=s2; } }
  const beats=[]; { let last=-9, avg=0; for(let f=3;f<F;f++){ const o=Math.max(0,B[f]-B[f-3]); avg+=(o-avg)*.01; if(o>avg*2.2+.06&&f/fps-last>.24&&o>=Math.max(0,B[f+1]-B[f-2])){ beats.push({t:f/fps,s:Math.min(1,o)}); last=f/fps; } } }
  const mean=(t0,t1)=>{ let s=0,c=0; for(let f=Math.max(0,Math.floor(t0*fps));f<Math.min(F,Math.floor(t1*fps));f++){ s+=E[f]; c++; } return c?s/c:0; };
  const cand=[]; for(let t=6;t<F/fps-6;t+=.1){ const af=mean(t,t+4), bf=mean(t-4,t); cand.push({t,sc:af-bf,af}); }
  cand.sort((x,y)=>y.sc-x.sc); const drops=[]; for(const c of cand){ if(c.sc<.16||c.af<.4) break; if(drops.every(d=>Math.abs(d-c.t)>20)) drops.push(c.t); } if(!drops.length&&cand.length) drops.push(cand[0].t);
  drops.sort((x,y)=>x-y); for(let i=0;i<drops.length;i++){ let best=null; for(const b of beats) if(Math.abs(b.t-drops[i])<.5&&(!best||b.s>best.s)) best=b; if(best) drops[i]=best.t; }
  return {fps,F,dur:data.length/sr,E,B,inten,beats,drops}; }

/* ---------------- the ride ---------------- */
let RIDE=null;
function buildRide(A){
  let sd=1234567; const rnd=()=>((sd=(sd*1664525+1013904223)>>>0)/4294967296);
  const T={X:[],Y:[],Z:[],YAW:[],PIT:[],ROL:[],V:[],T:[],GN:[]}, marks=[];
  let x=0,y=0,z=0,yaw=0,pit=0,rolB=0,rolX=0,v=3,t=0,kpS=0,kyS=0, vc=8;
  const at=(arr,tt)=>arr[clamp(Math.floor(tt*A.fps),0,A.F-1)];
  function step(kp,ky,mode){ kpS+=(kp-kpS)*Math.min(1,DS/4.5); kyS+=(ky-kyS)*Math.min(1,DS/7);            // curvature changes over a few metres: no jerk
    const gl=v*v*kyS/G; rolB+=(Math.atan(gl)*.95-rolB)*Math.min(1,DS/8);                                 // bank so the push goes down through the seat
    pit+=kpS*DS; yaw+=kyS*DS; const cp=Math.cos(pit); x+=Math.sin(yaw)*cp*DS; y+=Math.sin(pit)*DS; z-=Math.cos(yaw)*cp*DS;
    if(mode==='chain') v+=(vc-v)*Math.min(1,DS/3);
    else if(mode==='brake') v=Math.sqrt(Math.max(vc*vc,v*v-2*7*DS));
    else if(mode==='boost') v=Math.sqrt(v*v+2*9*DS);
    else v=Math.sqrt(Math.max(6.25,v*v+2*(-G*Math.sin(pit)-(.012*G+.00016*v*v))*DS));                    // energy: height becomes speed, drag takes a little
    t+=DS/v; const gn=(Math.cos(pit)+v*v*kpS/G)*Math.cos(rolB)+gl*Math.sin(rolB);
    T.X.push(x);T.Y.push(y);T.Z.push(z);T.YAW.push(yaw);T.PIT.push(pit);T.ROL.push(rolB+rolX);T.V.push(v);T.T.push(t);T.GN.push(gn); }
  const kFor=(Gt,dir,kmax)=>{ let k=(Gt-Math.cos(pit))*G/(v*v); k=dir>0?Math.max(k,1/70):Math.min(k,-1/70); return clamp(k,-kmax,kmax); };
  function toPitch(target,Gt,mode,fixedK){ const dir=Math.sign(target-pit); let n=0; while((target-pit)*dir>0&&n++<6000) step(fixedK?dir*fixedK:kFor(Gt,dir,1/9),0,mode); }
  function hold(p,len,mode,ky){ for(let s=0;s<len;s+=DS) step((p-pit)*.07,ky||0,mode); }
  function hill(th){ toPitch(th,3.5); toPitch(-th,.02); toPitch(0,3.6); hold(0,4); }                      // pull up, float over the top, pull out
  function turn(ang,gl,sg,p){ const y0=yaw; let n=0; while(Math.abs(yaw-y0)<ang&&n++<6000) step(((p||0)-pit)*.07,sg*Math.min(gl*G/(v*v),1/13)); hold(0,10); }
  function loop(){ const p0=pit; let n=0; while(pit<p0+6.283-.04&&n++<6000){ const Gt=2.9+1.8*Math.cos(pit); step(clamp(Math.max((Gt-Math.cos(pit))*G/(v*v),1/45),0,1/7),.005); } pit-=6.283; kyS=0; hold(0,8); }   // tighter at the top, where it is slow: a teardrop
  function corkscrew(){ const L=clamp(v*2.3,38,85), dir=rnd()<.5?1:-1; for(let s=0;s<L;s+=DS){ const u=s/L; rolX=dir*6.283*u*u*(3-2*u); step((0-pit)*.07,0); } rolX=0; hold(0,6); }
  function boost(vt){ let n=0; while(v<vt&&n++<3000) step((0-pit)*.07,0,'boost'); }
  function liftAndDrop(td){ const avail=td-t, H=clamp((avail-4)*6.5,26,92), steep=1.28+.15*rnd(), yBase=y-rnd()*10;
    const save=()=>({x,y,z,yaw,pit,rolB,rolX,v,t,kpS,kyS,n:T.X.length}), load=s=>{ ({x,y,z,yaw,pit,rolB,rolX,v,t,kpS,kyS}=s); for(const k in T) T[k].length=s.n; };
    const s0=save(); vc=clamp(H/.574/Math.max(4,avail-3),3,16); let i0=0,i1=0;
    for(let it=0;it<5;it++){ load(s0); toPitch(0,2.5); const tb0=t; let n=0; while(v>vc+.4&&n++<3000) step((0-pit)*.07,0,'brake'); if(v<vc-.5) boost(vc);
      const tA=t; i0=T.X.length; const yTop=y+H; toPitch(.61,0,'chain',1/20); n=0; while(y<yTop-3&&n++<6000) step((.61-pit)*.07,0,'chain'); i1=T.X.length;
      toPitch(-.52,.12); const err=t-td, Tc=t-tA; if(Math.abs(err)<.03) break; vc=clamp(vc*Tc/Math.max(1,Tc-err),2.5,17); }   // solve the chain speed so the crest falls on the drop
    marks.push({lift:[i0,i1],td,at:t});
    toPitch(-steep,.1); let n=0; while(n++<4000){ const vb=Math.sqrt(v*v+2*G*Math.max(0,y-yBase)), R=vb*vb/(3.5*G); if(y-yBase<=R*(1-Math.cos(steep))) break; step((-steep-pit)*.07,0); }
    toPitch(0,4); hold(0,5); }
  let sg=1, lastLoop=-99, lastHill=false;
  function pick(){ const e=at(A.inten,t), r=rnd(); if(v<11) boost(21);
    if(v>27&&e>.5&&t-lastLoop>14&&r<.4){ lastLoop=t; loop(); }
    else if(e>.55&&v>19&&r<.55) corkscrew();
    else if(!lastHill&&r<.8){ hill(Math.min(.82,.22+v/62)); lastHill=true; return; }
    else { sg=-sg; rnd()<.25&&v>20?turn(6.283*1.25,2.6+1.2*e,sg,-.1):turn(1.3+2.2*rnd(),2+1.7*e,sg); }
    lastHill=false; }
  hold(0,8); const drops=A.drops.filter(d=>d>7);
  for(const td of drops){ let n=0; while(td-t>15&&n++<200) pick(); liftAndDrop(td); }
  { let n=0; while(t<A.dur-2&&n++<400) pick(); }
  // A loop ends with pitch 2π further on, and a corkscrew with roll 2π further on. The generator resets those to zero, which is the same direction
  // but a jump in the stored number; anything that blends between two samples across that jump would swing through a full turn. So make them continuous.
  let jumps=0; for(const k of ['PIT','ROL','YAW']){ const a=T[k]; let o=0; for(let i=1;i<a.length;i++){ const d=a[i]+o-a[i-1]; if(d>3.1416){ o-=6.283185307; jumps++; } else if(d<-3.1416){ o+=6.283185307; jumps++; } a[i]+=o; } }
  const N=T.X.length, R={N,marks,A}; for(const k in T) R[k]=Float32Array.from(T[k]);
  R.report={jumpsFixed:jumps,metres:Math.round(N*DS),vmax:Math.max(...T.V)*3.6|0,gmax:+Math.max(...T.GN).toFixed(2),gmin:+Math.min(...T.GN).toFixed(2),drops:marks.map(m=>({song:+m.td.toFixed(2),ride:+m.at.toFixed(2)}))};
  return R; }
function idxAt(R,tt){ let lo=0, hi=R.N-1; while(lo<hi){ const m=(lo+hi)>>1; if(R.T[m]<tt) lo=m+1; else hi=m; } const i=Math.max(1,lo), k=clamp((tt-R.T[i-1])/Math.max(1e-6,R.T[i]-R.T[i-1]),0,1); return i-1+k; }
function frameAt(R,f,pos,d,u,r){ f=clamp(f,0,R.N-1.001); const i=f|0, k=f-i, L=a=>a[i]+(a[i+1]-a[i])*k, ya=L(R.YAW), pi=L(R.PIT), ro=L(R.ROL), sy=Math.sin(ya), cy=Math.cos(ya), sp=Math.sin(pi), cp=Math.cos(pi);
  pos.set(L(R.X),L(R.Y),L(R.Z)); d.set(sy*cp,sp,-cy*cp); u.set(-sy*sp,cp,cy*sp); r.crossVectors(d,u);
  const cr=Math.cos(ro), sr=Math.sin(ro), ux=u.x*cr+r.x*sr, uy=u.y*cr+r.y*sr, uz=u.z*cr+r.z*sr; r.set(r.x*cr-u.x*sr,r.y*cr-u.y*sr,r.z*cr-u.z*sr); u.set(ux,uy,uz); }

/* ---------------- rendering ---------------- */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(72,1,.08,2600), world=new THREE.Group(); scene.add(world);
const U={uPx:{value:600},uSpA:{value:0},uSpB:{value:0},uSpC:{value:0},uTime:{value:0},uCam:{value:new THREE.Vector3()},uBass:{value:0},uBeat:{value:0},uInt:{value:0},uNow:{value:0}};
const PAL='vec3 pal(float t){ return .5+.5*cos(6.28318*(t+vec3(0.,.33,.67))); }';
function trackMat(col,em,run,neon,hue){ return new THREE.ShaderMaterial({uniforms:Object.assign({uCol:{value:new THREE.Color(col)},uEm:{value:em},uRun:{value:run||0},uNe:{value:neon||0},uHue:{value:hue||0}},U),
  vertexShader:`varying vec3 vW,vN; void main(){ vec4 w=vec4(position,1.); vec3 n=normal;
#ifdef USE_INSTANCING
  w=instanceMatrix*w; n=mat3(instanceMatrix)*n;
#endif
  w=modelMatrix*w; vW=w.xyz; vN=n; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`precision highp float; uniform vec3 uCol,uCam; uniform float uEm,uRun,uNe,uHue,uTime,uBass,uBeat; varying vec3 vW,vN;
${PAL}
void main(){ vec3 n=normalize(vN), V=normalize(uCam-vW); float dist=length(uCam-vW), dif=max(dot(n,normalize(vec3(.3,.85,.4))),0.), rim=pow(1.-abs(dot(n,V)),2.5);
  float run=uRun*pow(.5+.5*sin(dist*.22-uTime*7.),8.)*(.4+1.6*uBass);                                      // light running away along the rails with the bass
  vec3 base=mix(uCol,mix(pal(dist*.011-uTime*.12),vec3(1.),.35),uNe); base=mix(base,pal(uTime*.035+.83),uHue);   // the connectors drift slowly through the colours, all together                                      // neon lines: colour flows along the track
  vec3 c=base*(.1+.5*dif+.7*rim)*(1.-uNe)+base*uEm*mix(1.+.5*uBeat+run,.5+1.5*uBeat+.6*uBass+run,step(.01,uNe));   // the neon lines breathe with the beat
  gl_FragColor=vec4(c*exp(-dist*.0055),1.); }`}); }
const objMat=new THREE.ShaderMaterial({uniforms:U,extensions:{derivatives:true},
  vertexShader:`attribute vec4 aI; uniform float uTime,uNow,uBeat,uBass,uSpA,uSpB,uSpC; varying vec3 vW; varying float vHue,vNear,vM;
mat3 rot(vec3 a,float g){ float c=cos(g), s=sin(g), o=1.-c; return mat3(o*a.x*a.x+c,o*a.x*a.y+a.z*s,o*a.z*a.x-a.y*s, o*a.x*a.y-a.z*s,o*a.y*a.y+c,o*a.y*a.z+a.x*s, o*a.z*a.x+a.y*s,o*a.y*a.z-a.x*s,o*a.z*a.z+c); }
void main(){ float dt=aI.x-uNow, sd=aI.z; vHue=aI.y; vM=aI.w; vNear=exp(-dt*dt*4.); vec3 p=position;
  if(vM<.5){ float k=floor(sd), gs=fract(sd), lag=k/9.;                                                  // gates are wheels: always turning, pushed faster by each beat, and each one in a series hears the push a little later
    float a=(lag<.5?mix(uSpA,uSpB,lag*2.):mix(uSpB,uSpC,lag*2.-1.))*(gs<.5?1.:-1.)+gs*6.283+k*.35;
    p.xy=mat2(cos(a),-sin(a),sin(a),cos(a))*p.xy; p.xy*=1.+.07*sin(uTime*1.6-k*.5)+.16*vNear; }      // a gate turns slowly in its own plane
  else p=rot(normalize(vec3(sd-.5,fract(sd*3.7)-.5,fract(sd*9.1)-.5)+.001),uTime*(.2+.5*fract(sd*5.3))+sd*40.)*p*(1.+.22*uBass);   // a solid tumbles and breathes with the bass
  vec4 w=modelMatrix*instanceMatrix*vec4(p,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; if(abs(dt)>30.) gl_Position=vec4(2.,2.,2.,1.); }`,
  fragmentShader:`precision highp float; uniform vec3 uCam; uniform float uTime,uBeat,uBass; varying vec3 vW; varying float vHue,vNear,vM;
${PAL}
void main(){ vec3 n=normalize(cross(dFdx(vW),dFdy(vW))), V=normalize(uCam-vW); float dist=length(uCam-vW), f=abs(dot(n,V)), dif=max(dot(n,normalize(vec3(.3,.85,.4))),0.);
  vec3 c=pal(vHue+uTime*.02), c2=pal(vHue+.35);
  vec3 col=c*(.12+.5*dif)+mix(c,c2,.5)*pow(1.-f,2.)*1.3+c*(vM<.5?(.22+.8*vNear+1.5*uBeat+.5*uBass)*smoothstep(1.,7.,dist)*.8+.05:(.12+.9*uBass+.6*uBeat));   // a gate dims as it reaches your face, so it does not flood the picture  // lit faces, glowing edges; gates flare as you pass through
  gl_FragColor=vec4(col*exp(-dist*.005),1.); }`});
const ADD={transparent:true,depthWrite:false,blending:THREE.AdditiveBlending};
function tunMat(st){ return new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:Object.assign({uSt:{value:st},uIn:{value:0}},U),   // fully opaque: the wall hides the track and the other tunnels beyond it
  vertexShader:`attribute vec2 aUV; attribute float aE; attribute vec3 aN; varying vec2 vUV; varying float vE; varying vec3 vW,vN; void main(){ vUV=aUV; vE=aE; vN=aN; vW=position; gl_Position=projectionMatrix*viewMatrix*vec4(position,1.); }`,
  fragmentShader:`precision highp float; uniform float uSt,uIn,uTime,uBeat,uBass; uniform vec3 uCam; varying vec2 vUV; varying float vE; varying vec3 vW,vN;
${PAL}
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
void main(){ float u=vUV.x, z=vUV.y, dist=length(vW-uCam); vec3 c;
  if(uSt<.5){ vec2 g=vec2(u*26.,z/1.5); g.y+=hash(vec2(floor(g.x),1.))*7.; vec2 id=floor(g), f=fract(g)-.5; float h=hash(id), r=.08+.3*h*h, d=length(f);      // glowing motes, scattered
    c=pal(h*3.+uTime*.05)*step(.45,hash(id+3.))*((1.-smoothstep(r*.6,r,d))+exp(-d*d/(r*r*2.))*(.3+3.2*uBeat)*smoothstep(.5,.24,d)); }   // the glow dies away in a circle well inside its cell, so no square edge can show
  else if(uSt<1.5){ float k=fract(u*5.+z*.06-uTime*.15), w=.42+.2*uBass; c=pal(z*.012+u-uTime*.1)*step(k,w); }                                              // spiral bands
  else if(uSt<2.5){ float a=u*6.28318, n=sin(a*3.+sin(z*.25+uTime*.5)*2.)+sin(z*.3+sin(a*2.-uTime*.4)*2.), k=fract(n*1.5+uTime*.3); c=pal(n*.2+z*.006-uTime*.05)*smoothstep(0.,.08,k)*smoothstep(.6,.5,k); }   // liquid contours

    let nd=1e9, hit=0; for(const m of R.marks){ if(m.td>t) nd=Math.min(nd,m.td-t); hit=Math.max(hit,Math.exp(-Math.pow((t-m.td)*2.2,2))); } $('#drop').style.opacity=hit;
    const onLift=R.marks.some(m=>i>=m.lift[0]&&i<m.lift[1]);
    $('#hud').textContent=`speed  ${(v*3.6).toFixed(0).padStart(3)} km/h\nforce  ${gn.toFixed(1).padStart(4)} g\nheight ${P.y.toFixed(0).padStart(4)} m\n${onLift?'chain lift':''}${nd<1e8?`\ndrop in ${nd.toFixed(1)} s`:''}`;
    if(document.activeElement!==$('#seek')) $('#seek').value=t/A_.dur; $('#tm').textContent=`${(t/60)|0}:${String((t%60)|0).padStart(2,'0')}`; }
  composer.render(); }
requestAnimationFrame(frame);
</script></body></html>
